name: CI

on:
  push:
    branches: [ "main" ]
    # 推送 v* 标签即发布正式版本（标签推送不受 paths-ignore 影响）
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
      - "install.sh"
      - "start-for-host.sh"
      - ".vscode/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/work-tunnel-vless
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22, 24 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ubuntu-latest 预装 shellcheck；只拦截 warning 及以上级别，
      # 结果转成 GitHub 注解，在运行摘要和 PR 代码行上直接可见
      - name: Lint shell scripts
        shell: bash
        run: |
          set -o pipefail
          shellcheck -S warning -f json1 start.sh run-cloudflared.sh start-for-host.sh install.sh \
            | jq -r '.comments[] | "::\(if .level == "error" then "error" else "warning" end) file=\(.file),line=\(.line),col=\(.column)::SC\(.code): \(.message)"'

  build-and-push:
    needs: [ test, lint, shellcheck ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 防止标签与 package.json 版本不一致（应使用 npm version 打标签）
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 先构建本机架构镜像并实际运行，确认容器能启动、健康检查通过且以非 root 运行
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: work-tunnel-vless:smoke
          cache-from: type=gha

      - name: Smoke test container
        run: |
          docker run -d --name smoke --health-interval=2s \
            -e UUID=4b1b6efa-1f0d-49ae-b66f-2ef036c26138 \
            -e TUNNEL_DOMAIN=tunnel.example.com \
            -e PORT=3000 \
            work-tunnel-vless:smoke
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs smoke
          uid="$(docker exec smoke id -u)"
          echo "health=$status uid=$uid"
          docker rm -f smoke
          [ "$status" = healthy ] && [ "$uid" != 0 ]

      # PR（尤其是 fork 提交的）拿不到 secrets，只构建不推送，因此跳过登录
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # GHCR 使用内置 GITHUB_TOKEN，无需额外配置 secrets
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # 标签发布：1.2.8、1.2、latest（latest 由 semver 自动附加）
          # main 推送：edge；两种情况都带 sha-xxxxxxx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # 发布时把 docker-hub.md 同步为 Docker Hub 仓库说明；
  # DOCKER_PASSWORD 须为具有 Read, Write, Delete 权限的 Docker Hub 访问令牌
  dockerhub-description:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/work-tunnel-vless
          # Docker Hub 简短描述上限 100 字节（一个汉字占 3 字节），超出会被截断
          short-description: "Node.js VLESS 代理，集成 Cloudflare Tunnel，支持 amd64/arm64"
          readme-filepath: ./docker-hub.md
